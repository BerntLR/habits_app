name: habits_app
description: Karos Habits – a simple daily habit tracker by Team BullPeak.
publish_to: "none"

version: 1.0.2+13

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  provider: ^6.0.5
  shared_preferences: ^2.2.3
  intl: ^0.20.2
  file_selector: ^1.0.0
  path_provider: ^2.1.0
  share_plus: ^10.0.0
  url_launcher: ^6.3.2

  # IAP (TipJar)
  in_app_purchase: ^3.2.0

  flutter_native_splash: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/

flutter_native_splash:
  color: "#000000"
  image: assets/karo.png
  android: true
  ios: true

  android_12:
    color: "#000000"
    image: assets/ikon_android12.png


# Android launcher icon (regenerate: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/launcher/icon.png"
  adaptive_icon_background: "#228D93"
  adaptive_icon_foreground: "assets/launcher/foreground.png"
  min_sdk_android: 21
